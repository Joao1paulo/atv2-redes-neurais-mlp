[project]
name = "am-at2-redes-neurais"
version = "0.1.0"
description = "Pipeline de Rede Neural MLP com Scikit-Learn e microsserviço REST em FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "numpy>=2.1.0",
    "joblib>=1.4.2",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
]

[tool.uv]
package = false